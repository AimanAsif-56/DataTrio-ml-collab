name: CI

on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check . --fix
          uv run ruff format .

      - name: Install package
        run: uv pip install -e .

      - name: Test
        run: uv run pytest tests/

      - name: Data checks
        run: uv run python -m datatrio_ml_collab.check_data

      - name: Smoke train
        run: uv run python -m datatrio_ml_collab.smoke_train
