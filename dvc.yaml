stages:
  prepare_dataset:
    cmd: py -3.10 -m datatrio_ml_collab.dataset
    deps:
    - data/raw/kddcup.csv
    outs:
    - data/processed/dataset.csv

  generate_features:
    cmd: py -3.10 -m datatrio_ml_collab.features
    deps:
    - data/processed/dataset.csv
    outs:
    - data/processed/features.csv
    - data/processed/labels.csv

  train_model:
    cmd: py -3.10 -m datatrio_ml_collab.modeling.train
    deps:
    - data/processed/features.csv
    - data/processed/labels.csv
    outs:
    - models/model.pkl

  predict:
    cmd: py -3.10 -m datatrio_ml_collab.modeling.predict
    deps:
    - data/processed/features.csv
    - models/model.pkl
    outs:
    - data/processed/predictions.csv